
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>original bluehaven studios web beyond limitssite</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>
    <body>
      <div id="root"></div>
      <script>
        (() => {
          const addAdminLink = () => {
            const footer = document.querySelector('footer');
            if (!footer || footer.querySelector('[data-bluehaven-admin-link]')) return;
            const terms = Array.from(footer.querySelectorAll('a')).find(link => link.textContent?.trim().toLowerCase() === 'terms of service');
            if (!terms?.parentElement) return;
            const admin = document.createElement('a'); admin.href='/admin'; admin.textContent='Admin'; admin.setAttribute('aria-label','Bluehaven Studios Admin'); admin.setAttribute('data-bluehaven-admin-link','true');
            admin.style.cssText='color:#4b5563;text-decoration:none;font-size:10px;line-height:1.25rem;transition:color .2s ease;'; admin.onmouseenter=()=>{admin.style.color='#d1d5db'}; admin.onmouseleave=()=>{admin.style.color='#4b5563'}; terms.parentElement.insertAdjacentElement('afterend',admin);
          };
          const sectionFor = key => {
            const direct=document.getElementById(key); if(direct)return direct.closest('section')||direct;
            const needles={hero:['bluehaven studios'],showreel:['featured showreel'],carousel:['brand identity design','motion graphics','social media content'],services:['what we do'],process:['the process'],portfolio:['our recent work','restaurants & food'],reviews:['reviews','what clients say'],expertise:['our expertise'],founder:['founder','creative director'],contact:["let's talk",'ready to get started','contact us','get in touch']}[key]||[];
            return Array.from(document.querySelectorAll('section')).find(section=>needles.some(n=>(section.textContent||'').toLowerCase().includes(n)))||null;
          };
          let applied=false;
          const applyCms=async()=>{if(applied)return;try{const response=await fetch('/api/portfolio',{cache:'no-store'});if(!response.ok)return;const cms=await response.json();const sections=Array.isArray(cms.sections)?cms.sections:[];const mapped=[];sections.forEach(section=>{const el=sectionFor(section.section_key);if(!el)return;el.setAttribute('data-bluehaven-section',section.section_key);const layout=section.layout||{};const spacing=layout.spacing==='compact'?'2rem':layout.spacing==='airy'?'7rem':'4rem';el.style.paddingTop=spacing;el.style.paddingBottom=spacing;el.style.textAlign=layout.alignment||'center';if(section.visible===false)el.style.display='none';else el.style.removeProperty('display');if(section.content?.heading){const heading=el.querySelector('h1,h2,h3');if(heading)heading.textContent=section.content.heading;}if(section.content?.intro){const p=Array.from(el.querySelectorAll('p')).find(x=>x.textContent?.trim());if(p)p.textContent=section.content.intro;}mapped.push({section,el});});const main=document.querySelector('main');if(main&&mapped.length){main.style.display='flex';main.style.flexDirection='column';mapped.forEach(({section,el})=>{const direct=el.closest('main > *');if(direct){direct.style.order=String(section.sort_order);direct.setAttribute('data-bluehaven-order',String(section.sort_order));}});}const site=cms.settings?.site||{};if(site.title)document.title=site.title;if(site.accent)document.documentElement.style.setProperty('--bluehaven-accent',site.accent);applied=true;}catch(error){console.warn('Bluehaven CMS bridge unavailable',error)}};
          const observer=new MutationObserver(addAdminLink);observer.observe(document.documentElement,{childList:true,subtree:true});addAdminLink();setTimeout(applyCms,700);setTimeout(applyCms,1800);
        })();
      </script>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
